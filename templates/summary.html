{% extends "layout.html" %}

{% block head %}
<script type="text/javascript">
  var hiddenstates = [];
  function togglestate(a, c) {
    var start = "a" + a + "c";
    var link = document.getElementById(start + c);
    var state = hiddenstates[a] || 0;
    if (state & c) { state -= c; link.textContent = '-'; }
    else            { state |= c; link.textContent = 'H'; }
    hiddenstates[a] = state;
    var spans = document.getElementsByTagName('span');
    for (var i = 0; i < spans.length; i++) {
      var span = spans[i];
      if (span.className.substr(0, start.length) === start) {
        var k = span.className.substr(start.length);
        span.style.display = ((state & k) === +k) ? 'none' : 'block';
      }
    }
  }
</script>
{% endblock %}

{% block content %}
{% for section in sections %}
<h2>
  <a name="{{ section.anchor }}"></a>
  <a href="/summary?category={{ section.category }}">{{ '{' }}{{ section.category }}{{ '}' }}</a>
  <a href="/summary?branch={{ section.branch }}">{{ section.branch }}</a>
  {% if section.ok %} &#x2705;{% endif %}
</h2>
{{ section.pre_html | safe }}
{% endfor %}
{% endblock %}
