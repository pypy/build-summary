# -*- mode: nginx -*-
# /etc/nginx/sites-available/buildbot

upstream buildbot {
    server localhost:8099;
}

upstream build_summary {
    server localhost:8100;
}
# Crawlers walking every archived build page cost the master (buildbot 0.8,
# on PyPy) one pickle load from disk per page; twistd.log showed hundreds an
# hour in Sep 2026. Rate-limit per client IP: 2 req/s sustained, bursts of
# 20 absorbed, anything beyond gets a 429.
limit_req_zone $binary_remote_addr zone=buildbot_req:10m rate=2r/s;

# Tighter limit, shared by both hosts, for the pages that do real work per
# hit: on buildbot an archived build page is a pickle load, a log page a
# bz2 read and the summary a walk over every recent build; on build-summary
# the log pages decompress and render a whole log and the matrix pages parse
# every build in the window (see the robots.txt route in app.py).
limit_req_zone $binary_remote_addr zone=heavy_req:10m rate=1r/s;

# Bulk scrapers to refuse outright. Starter list of the usual AI/SEO
# crawlers; add whatever the top user agents in
# /var/log/nginx/access.log turn out to be.
map $http_user_agent $bad_bot {
    default 0;
    ~*(GPTBot|ClaudeBot|Bytespider|Amazonbot|PetalBot|CCBot|meta-externalagent|AhrefsBot|SemrushBot|MJ12bot|DotBot) 1;
}

# === HTTP redirects + ACME challenge (both hosts) ===

server {
    listen 80;
    listen [::]:80;
    server_name buildbot.pypy.org build-summary.pypy.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# === buildbot.pypy.org ===

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name buildbot.pypy.org;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/build-summary.pypy.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/build-summary.pypy.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    if ($bad_bot) {
        return 403;
    }

    # buildbot 0.8 serves no robots.txt of its own, so every crawler is free
    # to walk every archived build. Keep them to the live pages.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /builders/*/builds/\nDisallow: /summary/longrepr\nDisallow: /json/\nDisallow: /waterfall\nDisallow: /grid\nDisallow: /tgrid\nDisallow: /console\nDisallow: /one_line_per_build\nCrawl-delay: 10\n";
    }

    # Shared by every proxied location below; nginx inherits these from the
    # server level as long as a location sets none of its own.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    limit_req_status 429;

    # Archived build and log pages, the summary and the JSON API: each hit
    # makes the master (buildbot 0.8, on PyPy) load pickles or logs from disk.
    location ~ ^/(builders/[^/]+/builds/|summary|json/|waterfall|grid|tgrid|console|one_line_per_build) {
        limit_req zone=heavy_req burst=5 nodelay;
        proxy_pass http://buildbot;
    }

    location / {
        limit_req zone=buildbot_req burst=20 nodelay;
        proxy_pass http://buildbot;
    }

    location ^~ /mirror/ {
        root /home/pypy-worker/public_html;
        fancyindex on;
        fancyindex_exact_size off;
        fancyindex_localtime on;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }


    location = /mirror {
        return 301 /mirror/;
    }

    client_max_body_size 100M;
}

# === build-summary.pypy.org ===

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name build-summary.pypy.org;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/build-summary.pypy.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/build-summary.pypy.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    if ($bad_bot) {
        return 403;
    }

    # Shared by every proxied location below; nginx inherits these from the
    # server level as long as a location sets none of its own.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    limit_req_status 429;

    # Whole-log pages: one full log decompress + render per hit.
    location ~ ^/(logs|longrepr|gha-log|gha-teardown-log)/ {
        limit_req zone=heavy_req burst=5 nodelay;
        proxy_pass http://build_summary;
    }

    # Matrix pages: parse every build in the window (cached after the first
    # hit, but a freshly restarted gunicorn worker pays for it again).
    location ~ ^/(summary|compare-branch|revision) {
        limit_req zone=heavy_req burst=3 nodelay;
        proxy_pass http://build_summary;
    }

    location / {
        limit_req zone=buildbot_req burst=20 nodelay;
        proxy_pass http://build_summary;
    }

    location ^~ /mirror/ {
        root /home/pypy-worker/public_html;
        fancyindex on;
        fancyindex_exact_size off;
        fancyindex_localtime on;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /mirror {
        return 301 /mirror/;
    }

    location ^~ /bench_results/ {
        root /home/pypy-worker/public_html;
        fancyindex on;
        fancyindex_exact_size off;
        fancyindex_localtime on;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /bench_results {
        return 301 /bench_results/;
    }

    client_max_body_size 100M;
}
